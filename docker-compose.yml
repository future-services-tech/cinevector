services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinevector}
      POSTGRES_USER: ${POSTGRES_USER:-cinevector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinevector}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: ${CONNECTIONSTRINGS__POSTGRES}
      ConnectionStrings__Redis: ${CONNECTIONSTRINGS__REDIS}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:5174
      Cors__AllowedOrigins__2: http://127.0.0.1:5174
      Cors__AllowedOrigins__3: http://localhost:5175
      Embedding__BaseUrl: ${EMBEDDING__BASEURL:-https://omniroute-ehdl.srv1293923.hstgr.cloud/v1}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_FB_CLIENT_ID: ${SPOTIFY_FB_CLIENT_ID}
      SPOTIFY_FB_CLIENT_SECRET: ${SPOTIFY_FB_CLIENT_SECRET}
    ports:
      - "5080:8080"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: ${CONNECTIONSTRINGS__POSTGRES}
      ConnectionStrings__Redis: ${CONNECTIONSTRINGS__REDIS}
      Embedding__BaseUrl: ${EMBEDDING__BASEURL:-https://omniroute-ehdl.srv1293923.hstgr.cloud/v1}
      TMDB_API_KEY: ${TMDB_API_KEY}
      OMNIROUTER_API_KEY: ${OMNIROUTER_API_KEY}

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5080
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  # Nuovo frontend (cinevector-newweb) in affiancamento al vecchio, per poterli confrontare fianco a fianco:
  # stessa API, stesso database, porta host separata.
  frontend-new:
    build:
      context: .
      dockerfile: infrastructure/docker/FrontendNew.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5080
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5175:80"

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me}
    ports:
      - "5050:80"

volumes:
  postgres_data:
